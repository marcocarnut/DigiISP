<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DigiISP</title>
  </head>
  <body>
    <header>
      <div class="topbar">
        <h1>DigiISP</h1>
        <select id="lang" class="lang" aria-label="Language / Idioma"></select>
      </div>
      <p class="sub" data-i18n="app.sub"></p>
      <nav>
        <a href="#devices" data-i18n="tab.devices"></a>
        <a href="#bootstrap" data-i18n="tab.bootstrap"></a>
      </nav>
    </header>

    <main>
      <p id="unsupported" class="banner error" hidden data-i18n="unsupported"></p>

      <div id="prompt" class="overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="prompt-text">
          <p id="prompt-text"></p>
          <div class="row">
            <button id="btn-prompt-ok" data-i18n="btn.continue"></button>
            <button id="btn-prompt-cancel" class="secondary" data-i18n="btn.cancel"></button>
          </div>
        </div>
      </div>

      <!-- Devices tab -->
      <div id="tab-devices">
        <section>
          <h2 data-i18n="prog.title"></h2>
          <div class="row">
            <button id="btn-connect" data-i18n="prog.connect"></button>
            <button id="btn-disconnect" class="secondary" hidden data-i18n="prog.disconnect"></button>
            <button id="btn-reboot" class="secondary" hidden data-i18n="prog.reboot" data-i18n-title="prog.reboot.title"></button>
            <button id="btn-fw-update" class="secondary" hidden data-i18n="fw.update" data-i18n-title="fw.update.title"></button>
          </div>
          <div id="fw-update" hidden>
            <label class="option hint" id="fw-upgrade-row"><input type="checkbox" id="fw-upgrade" checked /> <span data-i18n="fw.upgradeOption"></span></label>
            <progress id="fw-progress" max="1" value="0" hidden></progress>
            <ol id="fw-steps" class="checklist"></ol>
            <div id="fw-status"></div>
          </div>
          <div id="programmer"></div>
        </section>

        <section id="target-section" hidden>
          <h2 data-i18n="target.title"></h2>
          <div class="row wiring-controls">
            <label id="prog-board-row"><span data-i18n="target.yourProgrammer"></span>
              <select id="sel-prog-board"></select>
            </label>
            <label><span data-i18n="target.what"></span>
              <select id="sel-target-board"></select>
            </label>
          </div>
          <details class="section" id="wiring-section" open>
            <summary><h3 data-i18n="wiring.title"></h3> <span class="expand-hint"><span class="when-closed" data-i18n="details.show"></span><span class="when-open" data-i18n="details.hide"></span></span></summary>
            <div id="wiring"></div>
            <details class="subsection">
              <summary><span data-i18n="wiring.colors"></span> <span class="expand-hint"><span class="when-closed" data-i18n="details.show"></span><span class="when-open" data-i18n="details.hide"></span></span></summary>
              <div id="wire-colors" class="wire-colors"></div>
            </details>
          </details>
          <div class="row">
            <label>SCK
              <select id="sck"></select>
            </label>
            <button id="btn-read-target" data-i18n="target.identify"></button>
          </div>
          <label id="manual-reset-row" class="hint" hidden>
            <input type="checkbox" id="manual-reset" /> <span data-i18n="target.manual"></span>
          </label>
          <p class="hint" data-i18n="target.sckHint"></p>
          <div id="target-result"></div>
          <div id="target"></div>

          <div id="target-ops" hidden>
            <h3 data-i18n="flash.title"></h3>
            <div class="row">
              <button id="btn-flash-read" class="secondary" data-i18n="ops.readFile"></button>
              <label class="button"><span data-i18n="ops.writeHex"></span><input type="file" id="file-flash-write" accept=".hex,.ihex,.ihx" hidden /></label>
              <label class="button secondary"><span data-i18n="ops.verifyHex"></span><input type="file" id="file-flash-verify" accept=".hex,.ihex,.ihx" hidden /></label>
              <button id="btn-erase" class="secondary" data-i18n="ops.erase"></button>
            </div>
            <p class="hint" data-i18n="flash.hint"></p>

            <h3 data-i18n="eeprom.title"></h3>
            <div class="row">
              <button id="btn-ee-read" class="secondary" data-i18n="ops.readFile"></button>
              <label class="button secondary" id="ee-write-label"><span data-i18n="ops.writeHex"></span><input type="file" id="file-ee-write" accept=".hex,.eep,.ihex" hidden /></label>
            </div>

            <details class="section" id="fuse-section">
              <summary><h3 data-i18n="fuses.title"></h3> <span class="expand-hint"><span class="when-closed" data-i18n="details.show"></span><span class="when-open" data-i18n="details.hide"></span></span> <span class="hint" id="fuse-summary"></span></summary>
              <div id="fuse-editor"></div>
              <div class="row">
                <button id="btn-fuses-write" disabled data-i18n="fuses.write"></button>
                <button id="btn-lock-write" class="secondary" disabled data-i18n="lock.write"></button>
                <button id="btn-fuses-reset" class="secondary" disabled data-i18n="fuses.undo"></button>
              </div>
            </details>
          </div>

          <progress id="target-progress" max="1" value="0" hidden></progress>
          <ol id="target-steps" class="checklist"></ol>
          <div id="target-status"></div>
        </section>
      </div>

      <!-- Bootstrap tab -->
      <div id="tab-bootstrap" hidden>
        <section>
          <h2 data-i18n="boot.title"></h2>
          <p data-i18n="boot.intro"></p>
        </section>

        <section class="step" data-step="1">
          <h2><span class="step-no">1</span> <span data-i18n="step1.title"></span></h2>
          <p class="hint" data-i18n="step1.hint"></p>
          <ol class="howto" data-i18n-html="step1.howto"></ol>
          <label class="option hint"><input type="checkbox" id="step1-upgrade" checked /> <span data-i18n="fw.upgradeOption"></span></label>
          <div class="row">
            <button id="btn-step1" data-i18n="step1.btn"></button>
          </div>
          <progress id="step1-progress" max="1" value="0" hidden></progress>
          <ol id="step1-steps" class="checklist"></ol>
          <div id="step1-status"></div>
        </section>

        <section class="step" data-step="2">
          <h2><span class="step-no">2</span> <span data-i18n="step2.title"></span></h2>
          <p class="hint" data-i18n="step2.hint"></p>
          <div class="row wiring-controls">
            <label><span data-i18n="step2.first"></span>
              <select id="sel-first-board"></select>
            </label>
            <label><span data-i18n="step2.second"></span>
              <select id="sel-second-board"></select>
            </label>
          </div>
          <div id="step2-wiring"></div>
          <details class="subsection">
            <summary><span data-i18n="wiring.colors"></span> <span class="expand-hint"><span class="when-closed" data-i18n="details.show"></span><span class="when-open" data-i18n="details.hide"></span></span></summary>
            <div id="wire-colors-2" class="wire-colors"></div>
          </details>
          <p class="hint" data-i18n="step2.usbOnly"></p>
          <div id="step2-programmer"></div>
          <label class="option">
            <input type="checkbox" id="step2-rstdisbl" checked />
            <span data-i18n="step2.rstdisbl"></span>
          </label>
          <label class="option" id="step2-wired-row" hidden>
            <input type="checkbox" id="step2-wired" />
            <span data-i18n="step2.wired"></span>
          </label>
          <div class="row">
            <button id="btn-step2" disabled data-i18n="step2.btn"></button>
          </div>
          <progress id="step2-progress" max="1" value="0" hidden></progress>
          <ol id="step2-steps" class="checklist"></ol>
          <div id="step2-status"></div>
        </section>
      </div>

      <section>
        <details class="section">
          <summary><span data-i18n="log.title"></span> <span class="expand-hint"><span class="when-closed" data-i18n="details.show"></span><span class="when-open" data-i18n="details.hide"></span></span></summary>
          <pre id="log"></pre>
        </details>
      </section>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
