<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DigiISP wiring</title>
  </head>
  <body>
    <header>
      <div class="topbar">
        <h1 data-i18n="gallery.title"></h1>
        <select id="lang" class="lang" aria-label="Language / Idioma"></select>
      </div>
      <p class="sub" data-i18n="gallery.sub"></p>
    </header>
    <main>
      <section>
        <div class="row wiring-controls">
          <label><span data-i18n="gallery.programmer"></span> <select id="sel-programmer"></select></label>
          <label><span data-i18n="gallery.target"></span> <select id="sel-target"></select></label>
          <label><span data-i18n="gallery.layout"></span>
            <select id="sel-orientation">
              <option value="auto" data-i18n="gallery.layout.auto"></option>
              <option value="horizontal" data-i18n="gallery.layout.h"></option>
              <option value="vertical" data-i18n="gallery.layout.v"></option>
            </select>
          </label>
          <label><span data-i18n="gallery.highlight"></span>
            <select id="sel-highlight">
              <option value="" data-i18n="gallery.none"></option>
              <option>MOSI</option><option>MISO</option><option>SCK</option>
              <option>RESET</option><option>VCC</option><option>GND</option>
            </select>
          </label>
        </div>
        <div id="diagram"></div>
        <details class="subsection">
          <summary><span data-i18n="wiring.colors"></span></summary>
          <div id="wire-colors" class="wire-colors"></div>
        </details>
      </section>
    </main>
    <script type="module" src="./src/wiring/spike.ts"></script>
  </body>
</html>
